<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
        <link rel="stylesheet", href="../css/style.css">

</head>
<body>
    <header>
        <h1>Contact Me</h1>
    </header>

    <section>
        <p>If you would like to get in touch, please use the information below.</p>

        <ul>
            <li>Email: jordan.ramirez@email.com</li>
            <li>Location: Chicago, IL</li>
            <li>LinkedIn: linkedin.com/in/jordanramirez</li>
            <li>GitHub: github.com/jordanramirez</li>
        </ul>
    </section>

    <section>
        <h2>Send a Message</h2>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea><br><br>

            <input type="submit" value="Submit">
        </form>
    </section>
</body>
</html>
